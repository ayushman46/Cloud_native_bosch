services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/chaosai.sqlite3
    volumes:
      - chaos_data:/data
    ports:
      - "127.0.0.1:${CHAOSAI_HOST_API_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  dashboard:
    build: ./frontend
    ports:
      - "127.0.0.1:${CHAOSAI_HOST_DASHBOARD_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  chaos_data:
